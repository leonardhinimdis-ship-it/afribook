version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: afribook-postgres
    restart: always
    environment:
      POSTGRES_DB: afribook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afribook"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: afribook-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/afribook
      JWT_ACCESS_SECRET: afribook_access_secret_super_secure_key_2026_dakar_abidjan
      JWT_REFRESH_SECRET: afribook_refresh_secret_super_secure_key_2026_rotation_key
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_DAYS: 30
      CLIENT_URL: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
